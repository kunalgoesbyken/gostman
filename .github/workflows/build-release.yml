name: Build and Release

# Releases are driven by the version in gostman-gui/wails.json. Every push to
# main checks whether that version already has a release; when it does not,
# the installers are built on all three platforms and published as v<version>.
# To ship a release: bump info.productVersion and push.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WAILS_VERSION: 'v2.11.0'
  GO_VERSION: '1.24.5'
  NODE_VERSION: '20'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decide whether this version still needs a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r '.info.productVersion' gostman-gui/wails.json)"
          publish=true
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            cli_targets: linux/amd64
          - name: windows
            os: windows-latest
            cli_targets: windows/amd64
          - name: macos
            os: macos-latest
            cli_targets: darwin/arm64 darwin/amd64

    runs-on: ${{ matrix.os }}

    env:
      VERSION: ${{ needs.plan.outputs.version }}

    defaults:
      run:
        shell: bash
        working-directory: gostman-gui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: gostman-gui/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gostman-gui/frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS
        if: matrix.name == 'windows'
        run: command -v makensis || choco install nsis -y --no-progress

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build and package (Linux)
        if: matrix.name == 'linux'
        run: |
          wails build -clean -platform linux/amd64 -tags webkit2_41

          root=package
          install -Dm755 build/bin/Gostman "$root/usr/bin/gostman"
          install -Dm644 build/linux/gostman.desktop "$root/usr/share/applications/gostman.desktop"
          install -Dm644 build/appicon.png "$root/usr/share/pixmaps/gostman.png"
          install -Dm644 ../LICENSE "$root/usr/share/doc/gostman/copyright"
          tar -czf build/bin/Gostman-linux-amd64.tar.gz -C "$root" usr

          mkdir -p "$root/DEBIAN"
          sed "s/@VERSION@/$VERSION/" build/linux/control > "$root/DEBIAN/control"
          dpkg-deb -Zxz --build --root-owner-group "$root" build/bin/Gostman-linux-amd64.deb

      - name: Build the AppImage (Linux)
        if: matrix.name == 'linux'
        env:
          TOOLS_URL: https://github.com/tauri-apps/binary-releases/releases/download
          GTK_PLUGIN_URL: https://raw.githubusercontent.com/tauri-apps/tauri/8e7028331ad37ac2db74d4ec20e66be5cacf2c40/crates/tauri-bundler/src/bundle/linux/appimage/linuxdeploy-plugin-gtk.sh
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LDAI_OUTPUT: build/bin/Gostman-linux-x86_64.AppImage
          LDAI_UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|Gostman-linux-x86_64.AppImage.zsync
        run: |
          tools="$PWD/appimage-tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy" "$TOOLS_URL/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o "$tools/AppRun" "$TOOLS_URL/apprun-old/AppRun-x86_64"
          curl -fsSL -o "$tools/linuxdeploy-plugin-gtk.sh" "$GTK_PLUGIN_URL"
          (cd "$tools" && sha256sum -c) <<'SUMS'
          36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62  linuxdeploy
          f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f  AppRun
          ef6b9a980417243bc62e0241b51dc49876032afd1bab9b4762389f961b406d9b  linuxdeploy-plugin-gtk.sh
          SUMS
          chmod +x "$tools"/*
          convert build/appicon.png -resize 256x256 "$tools/gostman.png"

          appdir=AppDir
          libdir="$(pkg-config --variable=libdir webkit2gtk-4.1)"
          webkit="$libdir/webkit2gtk-4.1"
          for helper in WebKitNetworkProcess WebKitWebProcess injected-bundle/libwebkit2gtkinjectedbundle.so; do
            install -Dm755 "$webkit/$helper" "$appdir$webkit/$helper"
          done
          install -Dm755 build/bin/Gostman "$appdir/usr/bin/gostman"
          install -Dm755 "$tools/AppRun" "$appdir/AppRun"

          PATH="$tools:$PATH" linuxdeploy --appdir "$appdir" \
            --executable "$appdir/usr/bin/gostman" \
            --desktop-file build/linux/gostman.desktop \
            --icon-file "$tools/gostman.png"             --library "$libdir/libGLESv2.so.2" \
            --plugin gtk --output appimage
          mv "${LDAI_OUTPUT##*/}.zsync" "$(dirname "$LDAI_OUTPUT")/"

      # The installer adds Start menu and desktop shortcuts, an uninstaller and
      # the WebView2 runtime when it is missing. The bare executable is shipped
      # alongside it as a portable build.
      - name: Build and package (Windows)
        if: matrix.name == 'windows'
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          wails build -clean -platform windows/amd64 -nsis
          mv build/bin/Gostman.exe build/bin/Gostman-windows-amd64-portable.exe
          mv build/bin/Gostman-amd64-installer.exe build/bin/Gostman-windows-amd64.exe

      # The bundle is ad-hoc signed so it launches on Apple Silicon. It is not
      # notarized, so the first launch still needs right-click > Open.
      - name: Build and package (macOS)
        if: matrix.name == 'macos'
        run: |
          wails build -clean -platform darwin/universal
          codesign --force --deep --sign - build/bin/Gostman.app

          staging=dmg
          mkdir "$staging"
          cp -R build/bin/Gostman.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Gostman -srcfolder "$staging" -ov -format UDZO build/bin/Gostman-darwin-universal.dmg
          ditto -c -k --keepParent build/bin/Gostman.app build/bin/Gostman-darwin-universal.zip

      - name: Build and package the CLI
        working-directory: .
        env:
          CGO_ENABLED: '0'
          CLI_TARGETS: ${{ matrix.cli_targets }}
        run: |
          for target in $CLI_TARGETS; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            staging="cli-staging/$GOOS-$GOARCH"
            archive="gostman-gui/build/bin/gostman-cli-$GOOS-$GOARCH"
            mkdir -p "$staging"
            if [ "$GOOS" = windows ]; then
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$staging/gostman.exe" ./cmd/gostman
              (cd "$staging" && 7z a -tzip "../../$archive.zip" gostman.exe)
            else
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$staging/gostman" ./cmd/gostman
              tar -czf "$archive.tar.gz" -C "$staging" gostman
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gostman-${{ matrix.name }}
          path: |
            gostman-gui/build/bin/Gostman-*
            gostman-gui/build/bin/gostman-cli-*
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/Gostman-*
            artifacts/gostman-cli-*
          generate_release_notes: true

  image:
    needs: [plan, release]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the CLI image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.plan.outputs.version }}
          push: true
          tags: |
            ghcr.io/kunalgoesbyken/gostman:${{ needs.plan.outputs.version }}
            ghcr.io/kunalgoesbyken/gostman:latest
