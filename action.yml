name: Gostman run
description: Install the Gostman CLI and run an API collection, failing the job when a request or a check fails.
author: kunalgoesbyken

branding:
  icon: check-circle
  color: green

inputs:
  collection:
    description: Workspace folder or Gostman export file to run.
    required: true
  version:
    description: Release to install, for example 1.6.0. Defaults to the latest release.
    required: false
    default: latest
  environment:
    description: Environment name to use. Defaults to the first one in the collection.
    required: false
    default: ''
  folder:
    description: Run only this folder of the collection.
    required: false
    default: ''
  data:
    description: CSV or JSON file with one row per iteration.
    required: false
    default: ''
  reporter:
    description: One of text, json, junit, html or markdown.
    required: false
    default: text
  output:
    description: File to write the report to. The text summary is still printed.
    required: false
    default: ''
  redact:
    description: Replace secret values in the report with their names (secret and sensitive-named variables, --var-from-env and --env-file values, secret manager values, tokens, credentials and cookies). Other values, such as base_url, stay readable.
    required: false
    default: 'true'
  bail:
    description: Stop at the first failure.
    required: false
    default: 'false'
  extra-args:
    description: Further flags for gostman run, separated by spaces. Pass secrets with --var-from-env and the env block of the step.
    required: false
    default: ''
  summary:
    description: Add the results and the failed checks to the job summary. Needs gostman 1.14.0 or later.
    required: false
    default: 'true'
  comment:
    description: On a pull request, post the same results as one comment that later runs update. Needs gostman 1.14.0 or later and the pull-requests write permission.
    required: false
    default: 'false'
  github-token:
    description: Token used to post the pull request comment.
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: Exit code of gostman run. 0 passed, 1 a check, a script or an MCP tool call failed, or the run was interrupted, 2 wrong input, 3 a request got no response because it could not be sent, the connection failed or it timed out.
    value: ${{ steps.run.outputs.exit-code }}
  report:
    description: Path of the report file, empty when no output was requested.
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install gostman
      shell: bash
      env:
        GOSTMAN_VERSION: ${{ inputs.version }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS_NAME" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *) echo "unsupported runner OS: $RUNNER_OS_NAME" >&2; exit 2 ;;
        esac
        case "$RUNNER_ARCH_NAME" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported runner architecture: $RUNNER_ARCH_NAME" >&2; exit 2 ;;
        esac
        if [ "$os" = windows ]; then ext=zip; else ext=tar.gz; fi
        asset="gostman-cli-$os-$arch.$ext"
        base="https://github.com/kunalgoesbyken/gostman/releases"
        if [ "$GOSTMAN_VERSION" = latest ]; then
          url="$base/latest/download/$asset"
        else
          url="$base/download/v${GOSTMAN_VERSION#v}/$asset"
        fi
        dest="$RUNNER_TEMP/gostman-bin"
        mkdir -p "$dest"
        curl --fail --silent --show-error --location --output "$dest/$asset" "$url"
        if [ "$ext" = zip ]; then
          unzip -q -o "$dest/$asset" -d "$dest"
        else
          tar -xzf "$dest/$asset" -C "$dest"
        fi
        echo "$dest" >> "$GITHUB_PATH"

    - name: Run collection
      id: run
      shell: bash
      env:
        GOSTMAN_COLLECTION: ${{ inputs.collection }}
        GOSTMAN_ENVIRONMENT: ${{ inputs.environment }}
        GOSTMAN_FOLDER: ${{ inputs.folder }}
        GOSTMAN_DATA: ${{ inputs.data }}
        GOSTMAN_REPORTER: ${{ inputs.reporter }}
        GOSTMAN_OUTPUT: ${{ inputs.output }}
        GOSTMAN_REDACT: ${{ inputs.redact }}
        GOSTMAN_BAIL: ${{ inputs.bail }}
        GOSTMAN_EXTRA_ARGS: ${{ inputs.extra-args }}
        GOSTMAN_PUBLISH: ${{ inputs.summary == 'true' || inputs.comment == 'true' }}
      run: |
        set -uo pipefail
        args=(run "$GOSTMAN_COLLECTION" --reporter "$GOSTMAN_REPORTER")
        results=""
        if [ "$GOSTMAN_PUBLISH" = true ]; then
          if printf '%s\n' 1.14.0 "$(gostman version)" | sort -V -C; then
            results=$(mktemp "$RUNNER_TEMP/gostman-results.XXXXXX")
            args+=(--reporter "markdown:$results")
          else
            echo "::notice::The job summary and the pull request comment need gostman 1.14.0 or later."
          fi
        fi
        [ -n "$GOSTMAN_ENVIRONMENT" ] && args+=(--env "$GOSTMAN_ENVIRONMENT")
        [ -n "$GOSTMAN_FOLDER" ] && args+=(--folder "$GOSTMAN_FOLDER")
        [ -n "$GOSTMAN_DATA" ] && args+=(--data "$GOSTMAN_DATA")
        [ -n "$GOSTMAN_OUTPUT" ] && args+=(--output "$GOSTMAN_OUTPUT")
        [ "$GOSTMAN_REDACT" = true ] && args+=(--redact)
        [ "$GOSTMAN_BAIL" = true ] && args+=(--bail)
        if [ -n "$GOSTMAN_EXTRA_ARGS" ]; then
          read -r -a extra <<< "$GOSTMAN_EXTRA_ARGS"
          args+=("${extra[@]}")
        fi
        code=0
        gostman "${args[@]}" || code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$GOSTMAN_OUTPUT" >> "$GITHUB_OUTPUT"
        echo "results=$results" >> "$GITHUB_OUTPUT"
        exit "$code"

    - name: Publish results
      if: always() && steps.run.outputs.results != ''
      shell: bash
      env:
        GOSTMAN_RESULTS: ${{ steps.run.outputs.results }}
        GOSTMAN_SUMMARY: ${{ inputs.summary }}
        GOSTMAN_COMMENT: ${{ inputs.comment }}
        GOSTMAN_COMMENT_KEY: ${{ github.workflow }}/${{ github.job }}/${{ inputs.collection }}/${{ inputs.environment }}/${{ inputs.folder }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -uo pipefail
        [ -s "$GOSTMAN_RESULTS" ] || exit 0
        if [ "$GOSTMAN_SUMMARY" = true ]; then
          cat "$GOSTMAN_RESULTS" >> "$GITHUB_STEP_SUMMARY"
        fi
        [ "$GOSTMAN_COMMENT" = true ] || exit 0
        if ! command -v gh > /dev/null || ! command -v jq > /dev/null; then
          echo "::warning::The pull request comment needs gh and jq on the runner."
          exit 0
        fi
        pr=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
        [ -n "$pr" ] || exit 0
        marker="<!-- gostman-run $(printf '%s' "$GOSTMAN_COMMENT_KEY" | tr -c 'A-Za-z0-9._/-' '_') -->"
        body="$GOSTMAN_RESULTS.comment"
        {
          echo "$marker"
          cat "$GOSTMAN_RESULTS"
          echo
          echo "[Job log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
        } > "$body"
        comments="repos/$GITHUB_REPOSITORY/issues/$pr/comments"
        author=$(gh api user --jq .login 2> /dev/null) || author="github-actions[bot]"
        existing=$(gh api --paginate "$comments" | jq -r --arg author "$author" --arg marker "$marker" '.[] | select(.user.login == $author and (.body | startswith($marker))) | .id' | head -n 1)
        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F "body=@$body" > /dev/null
        else
          gh api --method POST "$comments" -F "body=@$body" > /dev/null
        fi || echo "::warning::Could not comment on pull request #$pr. Give the job the pull-requests: write permission; pull requests from forks get a read-only token."
