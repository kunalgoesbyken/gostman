id: req-create-todo
name: Create a todo
description: Sends a JSON body built from the title and completed variables. Run it with --data todos.csv to send one todo per row.
order: 3
method: POST
url: "{{base_url}}/todos"
bodyType: json
body: |
  {
    "userId": 1,
    "title": "{{title}}",
    "completed": {{completed}}
  }
assertions:
  - expression: res.status
    operator: eq
    value: "201"
  - expression: res.body.id
    operator: isNumber
  - expression: res.body.title
    operator: eq
    value: "{{title}}"
examples: |
  [
    {
      "id": "example-created-todo",
      "name": "Created",
      "status": 201,
      "headers": [{ "key": "Content-Type", "value": "application/json" }],
      "body": "{\n  \"userId\": 1,\n  \"id\": 201,\n  \"title\": \"{{request.body.json.title}}\",\n  \"completed\": {{request.body.json.completed}}\n}",
      "bodyEncoding": "utf8",
      "contentType": "application/json",
      "isDefault": true
    }
  ]
