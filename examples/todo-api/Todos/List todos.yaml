id: req-list-todos
name: List todos
description: Lists todos for one user and keeps the id of the first one for the next request.
order: 1
method: GET
url: "{{base_url}}/todos?userId=1"
extractors:
  - name: todo_id
    source: body
    expression: $[0].id
assertions:
  - expression: res.status
    operator: eq
    value: "200"
  - expression: res.body
    operator: isArray
  - expression: res.body[0].userId
    operator: eq
    value: "1"
examples: |
  [
    {
      "id": "example-todos",
      "name": "Todos of one user",
      "status": 200,
      "headers": [{ "key": "Content-Type", "value": "application/json" }],
      "body": "[\n  {\n    \"userId\": 1,\n    \"id\": 1,\n    \"title\": \"Write the first test\",\n    \"completed\": false\n  },\n  {\n    \"userId\": 1,\n    \"id\": 2,\n    \"title\": \"Run it in CI\",\n    \"completed\": true\n  }\n]",
      "bodyEncoding": "utf8",
      "contentType": "application/json",
      "isDefault": true
    }
  ]
