    <h1>Gostman: a free, open source API client</h1>
    <p>Send REST, GraphQL, gRPC and WebSocket requests, write tests, run collections in CI, mock APIs and let your coding agent use the same collection. No account, and your data stays on your device. Gostman needs JavaScript to run in the browser.</p>
    <h2>What you get</h2>
    <ul>
        <li>Requests for REST, GraphQL, gRPC, WebSocket and MCP servers, with environments, auth helpers and a cookie jar</li>
        <li>Assertions and scripts, a collection runner with data files, and HTML, JUnit and JSON reports</li>
        <li>A command line for CI, a GitHub Action and a Docker image</li>
        <li>A local mock server and traffic capture</li>
        <li>An MCP server so Claude Code, Codex and Cursor can use your collection without seeing your secrets</li>
        <li>Collections stored as plain YAML files you can commit to Git</li>
        <li>Import from Postman, Bruno, Insomnia, OpenAPI, HAR and curl</li>
    </ul>
