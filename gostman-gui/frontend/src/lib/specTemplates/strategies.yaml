openapi: 3.1.0
info:
  title: Strategies API
  version: 0.1.0
  description: Create and read trading strategies.
servers:
  - url: http://localhost:4010
tags:
  - name: strategies
    description: Trading strategies.
paths:
  /strategies:
    post:
      tags: [strategies]
      operationId: createStrategy
      summary: Create a strategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStrategy'
            example:
              name: Mean reversion
              symbol: AAPL
              maxPositionSize: 100
      responses:
        '201':
          description: The strategy was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'
        '400':
          description: The request is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /strategies/{strategyId}:
    get:
      tags: [strategies]
      operationId: getStrategy
      summary: Get a strategy
      parameters:
        - name: strategyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The strategy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'
        '404':
          description: There is no such strategy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    NewStrategy:
      type: object
      required: [name, symbol]
      properties:
        name:
          type: string
          example: Mean reversion
        symbol:
          type: string
          example: AAPL
        maxPositionSize:
          type: integer
          minimum: 1
          example: 100
    Strategy:
      allOf:
        - $ref: '#/components/schemas/NewStrategy'
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: The symbol is missing.
